name: daily

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-benchmark
  cancel-in-progress: false

jobs:
  filter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [nvidia, openrouter, google, mistral, nous, opencode]
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Filter ${{ matrix.provider }} models
        run: python3 -m shared.pipeline --filter-only --provider ${{ matrix.provider }}

  fetch-aa:
    runs-on: ubuntu-latest
    env:
      AA_API_KEY: ${{ secrets.AA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Fetch AA model data
        run: python3 -m shared.pipeline --fetch-aa-only

  benchmark:
    needs: [filter]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [nvidia, openrouter, google, mistral, nous, opencode]
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Run ${{ matrix.provider }} benchmark
        run: |
          DAY=$(date +%u)
          if [ "$DAY" = "1" ]; then
            echo "Monday: full re-benchmark of ${{ matrix.provider }}"
            python3 -m shared.pipeline --benchmark-only --provider ${{ matrix.provider }} --full
          else
            echo "Incremental: benchmark ${{ matrix.provider }} new models"
            python3 -m shared.pipeline --benchmark-only --provider ${{ matrix.provider }}
          fi

  match-render-deploy:
    needs: [benchmark, fetch-aa]
    runs-on: ubuntu-latest
    env:
      AA_API_KEY: ${{ secrets.AA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python3 -m pip install -r requirements.txt

      - name: Match all providers
        run: python3 -m shared.pipeline --match-only

      - name: Render leaderboard
        run: python3 -m shared.pipeline --render-only

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tps.csv data/aa_raw.json index.html nvidia/data/ openrouter/data/ google/data/ mistral/data/ nous/data/ opencode/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Data update"
            for attempt in 1 2; do
              if git push; then
                break
              fi
              if [ "$attempt" = "2" ]; then
                echo "Push failed after rebase retry" >&2
                exit 1
              fi
              echo "Push rejected, fetching and rebasing..."
              git fetch origin
              branch=$(git rev-parse --abbrev-ref HEAD)
              GIT_SEQUENCE_EDITOR=true git rebase "origin/$branch"
            done
          fi

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v5
